<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cleryl Skin Check</title>
<style>
:root{--bg:#fff;--ink:#2a14c4;--mut:#7068d8;--line:#e6e3fb;--btn:#361de6;--btn-ink:#fff;--sel:#361de6;--sel-ink:#fff;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
.mq{position:relative;z-index:3;background:var(--btn);color:var(--btn-ink);overflow:hidden;white-space:nowrap;font-family:var(--mono);font-size:10px;letter-spacing:.2em;padding:7px 0}
.mq div{display:inline-block;animation:mq 28s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--mut)}
.quote{font-size:15px;line-height:1.5;color:var(--mut);border-left:2px solid var(--btn);padding-left:14px;margin:0 0 28px;max-width:34ch}
.amb{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.amb i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;background:var(--blob);filter:blur(80px);opacity:.7;animation:drift 18s ease-in-out infinite alternate}
.amb i:nth-child(1){top:-30vmax;left:-20vmax}
.amb i:nth-child(2){bottom:-35vmax;right:-25vmax;animation-duration:24s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:14px 20px 0;height:56px}
.logo{height:16px;width:auto;display:block}
.back{width:40px;height:40px;margin-left:-10px;border:0;background:none;color:var(--ink);font-size:22px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s}
.back.on{opacity:1;pointer-events:auto}
.pg{position:relative;z-index:2;height:2px;margin:10px 20px 0;background:var(--line);border-radius:2px;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:var(--btn);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.stage{position:relative;z-index:1;flex:1;overflow:hidden}
.scr{position:absolute;inset:0;overflow-y:auto;padding:6vh 24px 32px;display:flex;flex-direction:column;opacity:0;transition:opacity .4s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
.scr.pf{transform:translateX(48px)}.scr.pb{transform:translateX(-48px)}
.scr.of{opacity:0;transform:translateX(-48px)}.scr.ob{opacity:0;transform:translateX(48px)}
.scr.on{opacity:1;transform:none}
.k{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--mut);text-transform:uppercase;margin-bottom:14px}
h1{font-size:clamp(24px,6.8vw,30px);line-height:1.15;letter-spacing:-.015em;margin:0 0 16px;font-weight:650}
h2{font-size:clamp(26px,7.4vw,33px);line-height:1.15;letter-spacing:-.015em;margin:0 0 26px;font-weight:650}
.lead{color:var(--mut);font-size:17px;line-height:1.5;margin:0 0 28px;max-width:34ch}
.sp{flex:1}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);font:inherit;font-size:18px;padding:18px 6px;cursor:pointer;border-radius:0;transition:background .25s,color .25s,padding .25s,border-radius .25s}
.row:last-of-type{border-bottom:1px solid var(--line)}
.row b{font-family:var(--mono);font-weight:500;color:var(--mut);font-size:13px;min-width:20px;font-variant-numeric:tabular-nums}
.row:active,.row.sel{background:var(--sel);color:var(--sel-ink);padding-left:16px;border-radius:14px;border-color:transparent}
.row.sel b{color:inherit;opacity:.6}
.cta{box-shadow:0 8px 24px -10px var(--btn);display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:999px;background:var(--btn);color:var(--btn-ink);font:inherit;font-size:17px;font-weight:650;padding:18px;cursor:pointer;text-decoration:none;transition:transform .2s,opacity .3s}
.cta:active{transform:scale(.97)}
.cta.alt{background:var(--bg);color:var(--btn);border:1.5px solid var(--btn);box-shadow:none;margin-top:10px;padding:15px}
.cta[disabled]{opacity:.25;pointer-events:none}
.ghost{background:none;border:0;color:var(--mut);font:inherit;font-size:14px;padding:14px;cursor:pointer;text-decoration:underline}
.name{width:100%;border:0;border-bottom:2px solid var(--btn);background:none;color:var(--ink);font:inherit;font-size:30px;font-weight:600;padding:8px 0;border-radius:0;outline:none;margin-bottom:14px}
.name::placeholder{color:var(--line)}
.small{font-size:12px;color:var(--mut);line-height:1.5;margin:0 0 22px}
.load{align-items:center;justify-content:center;text-align:center}
.dots{display:flex;gap:8px;margin-bottom:22px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--btn);animation:b 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{transform:scale(.5);opacity:.3}40%{transform:scale(1);opacity:1}}
.rise{opacity:0;transform:translateY(18px);animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.tag{border:1px solid var(--btn);color:var(--btn);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
.prod{padding:18px 0;border-top:1px solid var(--line)}
.prod small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--mut);text-transform:uppercase;margin-bottom:4px}
.prod b{display:block;font-size:19px;margin-bottom:4px}
.prod span{color:var(--mut);font-size:15px;line-height:1.5}
.bar{padding:10px 24px calc(14px + env(safe-area-inset-bottom,0px));position:relative;z-index:3;display:none;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.bar.on{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rise{opacity:1;transform:none}}
</style>
</head>

{q:"Saat mencoba produk baru, kulitmu…",o:[["Jarang bereaksi",{}],["Kadang merah atau perih",{sens:1}],["Sering merah, perih, atau gatal",{sens:2}]]},
{q:"Seberapa sering kamu berjerawat?",o:[["Jarang",{}],["Kadang, saat stres atau menjelang haid",{acne:1}],["Sering",{acne:2}]]}];
var TYPES={dry:["Kering","Kulit cenderung kurang lembap. Prioritaskan hidrasi dan menjaga skin barrier."],normal:["Normal","Kulit relatif seimbang. Fokus pada menjaga hidrasi dan merawat concern spesifikmu."],combo:["Kombinasi","T-zone cenderung berminyak, area pipi normal. Pilih tekstur ringan yang tetap melembapkan."],oily:["Berminyak","Produksi minyak cenderung tinggi. Pilih tekstur ringan dan non-comedogenic."]};
var SERUM={n:"Phyto Cell Overnight Treatment Serum",d:"Baolift, ceramide, dan natural oils. Membantu kulit terlihat lebih kencang, garis halus berkurang, dan lebih terhidrasi. Langkah terakhir rutinitas malam."};
var CREAM={n:"Even Tone Perfecting Cream",d:"Green Tea Biotechnology dan 10% Azeclair. Membantu meratakan warna kulit dan memudarkan tampilan noda bekas jerawat. Pelembap non-comedogenic, pagi dan malam."};
var REC={spots:[CREAM,SERUM],tone:[CREAM,SERUM],lines:[SERUM,CREAM],dry:[SERUM,CREAM],acne:[CREAM,SERUM]};
// 0 intro, 1 nama, 2 usia, 3 concern, 4-8 tes, 9 loading, 10 hasil
var S={name:"",age:"",concern:null,ans:[]},cur=null,idx=-1,busy=false;
var $=function(i){return document.getElementById(i)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

function build(i){
  var s=el("section","scr");
  if(i===0){
    s.appendChild(el("div","k","CLERYL Skin Test_"));
    s.appendChild(el("h1","","Kenali kulitmu."));
    s.appendChild(el("p","quote","Formulated with acne-prone skin in mind, innovated for all skin types."));
    s.appendChild(el("p","lead","Delapan pertanyaan singkat, kurang dari satu menit. Dapatkan panduan awal dan rekomendasi dari skin expert Cleryl."));
    s.appendChild(el("div","sp"));
    var b=el("button","cta","Mulai →");b.onclick=function(){go(1)};s.appendChild(b);
  }else if(i===1){
    s.appendChild(el("div","k","01 · Kenalan dulu"));
    s.appendChild(el("h2","","Siapa namamu?"));
    var inp=el("input","name");inp.placeholder="Nama kamu";inp.autocomplete="given-name";inp.value=S.name;s.appendChild(inp);
    s.appendChild(el("p","small","Nama dan jawabanmu akan disimpan di Google Sheets milik Cleryl untuk rekomendasi dan follow-up skincare."));
    s.appendChild(el("div","sp"));
    var n=el("button","cta","Lanjut →");n.disabled=!S.name;
    inp.oninput=function(){S.name=inp.value.trim();n.disabled=!S.name};
    inp.onkeydown=function(e){if(e.key==="Enter"&&S.name){inp.blur();go(2)}};
    n.onclick=function(){go(2)};s.appendChild(n);
    setTimeout(function(){if(window.innerWidth>700)inp.focus()},500);
  }else if(i===2){
    s.appendChild(el("div","k","02 · Usia"));s.appendChild(el("h2","","Hai "+S.name+", usiamu berapa?"));
    AGES.forEach(function(a,j){opt(s,a,j,S.age===a,function(){S.age=a;go(3)})});
  }else if(i===3){
    s.appendChild(el("div","k","03 · Fokus"));s.appendChild(el("h2","","Apa concern utama kulitmu?"));
    CONCERNS.forEach(function(c,j){opt(s,c.t,j,S.concern&&S.concern.k===c.k,function(){S.concern=c;go(4)})});
  }else if(i>=4&&i<=8){
    var q=QS[i-4];
    s.appendChild(el("div","k","0"+(i)+" · Tes kulit "+(i-3)+"/5"));s.appendChild(el("h2","",q.q));
    q.o.forEach(function(o,j){opt(s,o[0],j,S.ans[i-4]===o[1],function(){S.ans[i-4]=o[1];go(i+1)})});
  }else if(i===9){
    s.classList.add("load");
    var d=el("div","dots");d.appendChild(el("i"));d.appendChild(el("i"));d.appendChild(el("i"));s.appendChild(d);
    s.appendChild(el("h2","","Membaca kulitmu…"));
    setTimeout(function(){go(10)},1500);
  }else{result(s)}
  return s;
}
function opt(s,t,j,sel,fn){
  var b=el("button","row"+(sel?" sel":""));b.appendChild(el("b","",String(j+1).padStart(2,"0")));b.appendChild(document.createTextNode(t));
  b.onclick=function(){if(busy)return;b.classList.add("sel");busy=true;setTimeout(function(){busy=false;fn()},260)};
  s.appendChild(b);
}
function getAnswerLabel(questionIndex){
  var selected=S.ans[questionIndex];
  if(!selected)return "";
  var question=QS[questionIndex];
  for(var i=0;i<question.o.length;i++){
    if(question.o[i][1]===selected)return question.o[i][0];
  }
  return "";
}
function saveSkinCheck(sc,best,sens,acne,recommendations){
  if(!GOOGLE_SCRIPT_URL||GOOGLE_SCRIPT_URL.indexOf("PASTE_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE")!==-1){
    console.warn("Cleryl Skin Check belum terhubung ke Google Sheets: URL Apps Script belum diisi.");
    return;
  }
  var payload={
    submittedAt:new Date().toISOString(),
    name:S.name,
    age:S.age,
    concernKey:S.concern.k,
    concernLabel:S.concern.t,
    answers:QS.map(function(q,i){return {question:q.q,answer:getAnswerLabel(i)}}),
    scores:sc,
    result:{
      skinTypeKey:best,
      skinTypeLabel:TYPES[best][0],
      sensitive:sens,
      acneProne:acne,
      recommendations:recommendations.map(function(p){return p.n})
    },
    source:"CLERYL Skin Test"
  };
  // mode:no-cors membuat respons tidak dapat dibaca browser. Jangan tampilkan klaim sukses kepada pengguna.
  fetch(GOOGLE_SCRIPT_URL,{
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
    body:new URLSearchParams({payload:JSON.stringify(payload)}).toString()
  }).catch(function(err){console.error("Pengiriman data Cleryl Skin Check gagal:",err)});
}

function result(s){
  var sc={dry:0,normal:0,combo:0,oily:0,sens:0,acne:0};
  S.ans.forEach(function(a){for(var k in a)sc[k]+=a[k]});
  var best="normal";["combo","oily","dry","normal"].forEach(function(k){if(sc[k]>sc[best])best=k});
  var sens=sc.sens>=2,acne=sc.acne>=1,t=TYPES[best],d=0;
  function r(n){n.classList.add("rise");n.style.animationDelay=(d++*0.12)+"s";s.appendChild(n);return n}
  r(el("div","k","Hasil untuk "+S.name));
  r(el("h1","","Kulitmu cenderung "+t[0].toLowerCase()+(sens?" dan sensitif":"")+"."));
  var tg=el("div","tags");[ "Kulit "+t[0] ].concat(sens?["Cenderung sensitif"]:[],acne?["Cenderung berjerawat"]:[],[S.concern.t]).forEach(function(x){tg.appendChild(el("span","tag",x))});r(tg);
  r(el("p","lead",t[1]+(sens?" Karena kulitmu cenderung sensitif, kenalkan produk baru satu per satu.":"")));
  var recommendations=REC[S.concern.k];
  recommendations.forEach(function(p,i){var w=el("div","prod");w.appendChild(el("small","",i===0?"Untuk concern utamamu":"Pendamping"));w.appendChild(el("b","",p.n));w.appendChild(el("span","",p.d));r(w)});
  saveSkinCheck(sc,best,sens,acne,recommendations);
  var c=el("div","prod");c.appendChild(el("small","","Real Skin Club"));c.appendChild(el("span","","Komunitas Cleryl untuk belajar dan berbagi soal kulit dan wellness. Tanyakan ke tim kami cara bergabung."));r(c);
  r(el("p","small","Hasil ini panduan awal dari jawabanmu, bukan diagnosis medis. Semua produk Cleryl non-comedogenic dan dikembangkan dengan kulit acne-prone sebagai acuan."));
  var g=el("button","ghost","Ulangi tes");g.onclick=function(){S.ans=[];go(4,"b")};r(g);
  s.style.paddingBottom="190px";
  var msg="Hi CLERYL Skin Expert! I just completed the CLERYL Skin Test at Jakarta Meet & Dine. I'd love to know more about my skin and which CLERYL products would be suitable for me.";
  $("wa").href="https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(msg);
}
function go(i,force){
  var dir=force||(i>=idx?"f":"b"),old=cur,n=build(i);
  n.classList.add(dir==="f"?"pf":"pb");$("stage").appendChild(n);void n.offsetWidth;
  n.classList.remove("pf","pb");n.classList.add("on");
  if(old){old.classList.remove("on");old.classList.add(dir==="f"?"of":"ob");setTimeout(function(){old.remove()},520)}
  cur=n;idx=i;
  $("pg").style.width=(i<=0?0:i>=9?100:((i-1)/8)*100+6)+"%";
  $("back").classList.toggle("on",i>=1&&i<=8);
  $("bar").classList.toggle("on",i===10);
}
$("back").onclick=function(){if(idx>=1&&idx<=8&&!busy)go(idx-1,"b")};
go(0);
</script>
</body>
</html>
